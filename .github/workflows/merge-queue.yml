name: Merge Queue Check

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Skip on pull_request (real check only runs in the merge queue)
        if: github.event_name == 'pull_request'
        run: echo 'Not run on pull_request events; this only runs for real in the merge queue.'

      - name: Require [Pass-Merge] in commit message
        if: github.event_name == 'merge_group'
        env:
          COMMIT_MESSAGE: ${{ github.event.merge_group.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" == *"[Pass-Merge]"* ]]; then
            echo 'assuming all checks pass'
          else
            echo "Commit message does not contain [Pass-Merge]"
            exit 1
          fi
